[Match]
Distribution = gentoo

[Output]
Format          = none
Output          = tests-for-sam
OutputDirectory = /var/tmp/mkosi/%o

[Build]
SandboxTrees          = sandbox
PackageCacheDirectory = /var/cache/binpkgs/%o
BuildDirectory        = %O/build
CacheDirectory        = %O/cache
WorkspaceDirectory    = %O/wsd
ToolsTree             = %O/stage3
