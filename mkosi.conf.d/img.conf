[Match]
Distribution = gentoo

[Output]
Output          = osif
Format          = none
OutputDirectory = /var/tmp/mkosi/%o

[Build]
SandboxTrees          = sandbox
PackageCacheDirectory = /var/cache/binpkgs
BuildDirectory        = %O/build
CacheDirectory        = %O/cache
WorkspaceDirectory    = %O/wsd
ToolsTree             = %O/stage3
# this are mainly for ConfigureScripts below
# BuildSources          = %D/../../../mkosi:mkosi,%D/sandbox/etc/kernel:etc-kernel,%D/sandbox:installroot,%O/stage3/usr/src:.,/usr/src/linux.git:linux.git,/efi:/efi

[Content]
ExtraTrees           = extra

[Config]
# ConfigureScripts = configure
