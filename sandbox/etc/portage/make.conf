# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8

USE="utils \
netlink \
uring io-uring \
nfs nfsv4 -nfsv3 sssd acl \
gssapi kerberos kinit \
quic \
policykit \
maildir pcre \
numa \
tpm \
-X \
-dvd -mpeg -cups \
-iptables -xtables \
-info -doc \
-readline libedit \
-python -perl
"

FEATURES="
-sandbox \
-pid-sandbox \
-ipc-sandbox \
-network-sandbox \
-news \
-userfetch \
-userpriv \
-usersandbox \
-usersync \
-collision-protect \
-ebuild-locks \
-merge-wait \
-merge-sync \
parallel-install \
parallel-fetch \
protect-owned \
noman nodoc noinfo
"

EGIT_CLONE_TYPE='shallow'

EMERGE_DEFAULT_OPTS="
${EMERGE_DEFAULT_OPTS} \
---keep-going \
---buildpkg=y \
---usepkg=y \
---usepkg-exclude-live=n \
---binpkg-respect-use=y \
---changed-deps-report=y \
---changed-deps=y \
---binpkg-changed-deps=n \
---complete-graph=y \
---deep \
---with-bdeps-auto=y \
---implicit-system-deps=n \
---jobs \
--verbose-conflicts
"
# --usepkg-exclude=x11-drivers/nvidia-drivers
# --usepkg-exclude=cosmic-base/cosmic-comp
# --getbinpkg=y # this will pull from gentoo
# RUSTFLAGS="-C target-cpu=native -C link-arg=-Wl,-z,pack-relative-relocs"
LLVM_TARGETS="BPF WebAssembly AArch64 RISCV NVPTX"
RUST_SYSROOTS="bpf wasm"
