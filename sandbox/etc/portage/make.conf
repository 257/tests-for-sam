# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8

FEATURES="
-sandbox
-pid-sandbox
-ipc-sandbox
-network-sandbox
-news
-userfetch
-userpriv
-usersandbox
-usersync
-collision-protect
-ebuild-locks
-merge-wait
-merge-sync
parallel-install
parallel-fetch
protect-owned
noman nodoc noinfo
"

EMERGE_DEFAULT_OPTS="
${EMERGE_DEFAULT_OPTS}
--buildpkg=y
--usepkg=y
--usepkg-exclude-live=n
--binpkg-respect-use=n
--binpkg-changed-deps=n
--implicit-system-deps=n
--deep 2048
--verbose=y
--complete-graph=y
--jobs
--usepkg-exclude=acct-user/systemd-*
--buildpkg-exclude=acct-user/systemd-*
--usepkg-exclude=acct-group/systemd-*
--buildpkg-exclude=acct-group/systemd-*
--usepkg-exclude=sys-apps/portage
--buildpkg-exclude=sys-apps/portage
"
